[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmia-research"
version = "0.1.0"
description = "Reproducible pilot evaluation for Micro Modular Intelligence Architecture"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inference = ["numpy>=1.24,<2", "torch==2.10.0", "transformers==4.57.6"]
training = [
  "numpy==1.25.2",
  "torch==2.10.0",
  "transformers==4.57.6",
  "peft==0.17.1",
  "accelerate==1.10.1",
]

[project.scripts]
mmia = "mmia.harness:main"

[tool.setuptools.packages.find]
where = ["src"]
